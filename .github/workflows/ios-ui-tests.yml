name: iOS UI Tests

on:
  push:
    branches:
      - codex/ios-actions-trial
      - 'UITests/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: EasyBank on iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the project
        uses: actions/checkout@v4

      - name: Select an available iPhone
        id: simulator
        run: |
          mkdir -p test-results
          xcodebuild -version
          xcrun simctl list devices available --json > test-results/devices.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path('test-results/devices.json').read_text())['devices']
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-18-5'
          iphones = [d for d in devices.get(runtime, []) if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No iOS 18.5 iPhone is installed on this runner. See devices.json.')
          device = sorted(iphones, key=lambda d: d['name'])[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"udid={device['udid']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## iOS UI Tests\n\nDevice: **{device['name']}**, iOS 18.5, Xcode 16.4.\n\n")
          print(f"Selected {device['name']} ({device['udid']})")
          PY

      - name: Install video tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ffmpeg

      - name: Build the app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project EasyBank.xcodeproj \
            -scheme EasyBank \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -only-testing:EasyBankUITests \
            -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-results/build.log

      - name: Run UI tests and record the simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: python3 scripts/ci/record-tests.py

      - name: Convert video for Windows
        if: always()
        run: |
          if [ -s test-results/simulator-recording.mov ]; then
            ffmpeg -hide_banner -loglevel warning -y \
              -i test-results/simulator-recording.mov \
              -vf 'scale=720:1280:force_original_aspect_ratio=decrease:force_divisible_by=2' \
              -c:v libx264 -profile:v main -level:v 3.1 -pix_fmt yuv420p -r 30 \
              -movflags +faststart -an test-results/ui-tests.mp4
            ffprobe -v error -show_entries stream=codec_name,profile,pix_fmt,width,height,r_frame_rate:format=format_name,duration,size \
              -of json test-results/ui-tests.mp4 > test-results/video-info.json
            ffmpeg -hide_banner -v error -i test-results/ui-tests.mp4 -f null -
            rm test-results/simulator-recording.mov
          else
            echo "No video was recorded. Check the build/test and recording logs." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Prepare readable results and screenshots
        if: always()
        run: python3 scripts/ci/export-results.py

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
